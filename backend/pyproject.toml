[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathways-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.1,<4",
  "geoalchemy2>=0.15,<1", "python-dotenv>=1,<2",
  "fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
pathways-seed = "app.db.seed:main"
pathways-content = "app.content_admin:main"
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

