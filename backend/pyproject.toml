[project]
name = "pathways-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.1,<4",
  "geoalchemy2>=0.15,<1", "python-dotenv>=1,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
pathways-seed = "app.db.seed:main"
[tool.pytest.ini_options]
pythonpath = ["."]
